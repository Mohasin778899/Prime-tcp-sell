<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MOHASIN TCP - Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <style>
        body { background-color: #030008; background-image: radial-gradient(circle at top right, rgba(124, 58, 237, 0.2), transparent), radial-gradient(circle at bottom left, rgba(236, 72, 153, 0.2), transparent); font-family: 'Outfit', sans-serif; }
        .glass-card { background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(255, 255, 255, 0.08); border-radius: 24px; backdrop-filter: blur(16px); box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5); }
        .neon-text { background: linear-gradient(90deg, #a855f7, #ec4899, #f97316); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        input { background: rgba(0, 0, 0, 0.4) !important; border: 1px solid rgba(255, 255, 255, 0.1) !important; color: #fff !important; }
        input:focus { border-color: #a855f7 !important; box-shadow: 0 0 15px rgba(168, 85, 247, 0.2); outline: none; }
        .btn-primary { background: linear-gradient(135deg, #7c3aed, #c026d3); box-shadow: 0 4px 15px rgba(124, 58, 237, 0.3); transition: 0.3s; }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 8px 25px rgba(124, 58, 237, 0.5); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4 text-white">

    <div class="w-full max-w-md">
        <div class="text-center mb-8">
            <h1 class="text-4xl font-extrabold neon-text mb-2">MOHASIN TCP</h1>
            <p class="text-xs text-gray-400 uppercase tracking-widest font-semibold">Premium Bot Controller</p>
        </div>

        <div class="glass-card p-8">
            <div class="flex bg-black/50 p-1 rounded-xl mb-8">
                <button onclick="switchTab('login')" id="tab-login" class="flex-1 py-3 rounded-lg font-bold text-sm bg-purple-600 text-white shadow-lg">LOGIN</button>
                <button onclick="switchTab('register')" id="tab-register" class="flex-1 py-3 rounded-lg font-bold text-sm text-gray-400 hover:text-white transition">REGISTER</button>
            </div>

            <div id="form-login">
                <div class="space-y-4 mb-6">
                    <div>
                        <label class="text-xs text-gray-400 mb-1 block">Username</label>
                        <input type="text" id="login-username" placeholder="Enter username" class="w-full p-4 rounded-xl">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 mb-1 block">Password</label>
                        <input type="password" id="login-password" placeholder="Enter password" class="w-full p-4 rounded-xl">
                    </div>
                </div>
                <button onclick="doLogin()" class="btn-primary w-full py-4 rounded-xl font-bold text-white tracking-wide">SIGN IN</button>
            </div>

            <div id="form-register" class="hidden">
                <div class="space-y-4 mb-6">
                    <div>
                        <label class="text-xs text-gray-400 mb-1 block">Username</label>
                        <input type="text" id="reg-username" placeholder="Choose a username" class="w-full p-4 rounded-xl">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 mb-1 block">Password</label>
                        <input type="password" id="reg-password" placeholder="Create a password" class="w-full p-4 rounded-xl">
                    </div>
                    <div>
                        <label class="text-xs text-gray-400 mb-1 block">Email (Optional)</label>
                        <input type="email" id="reg-email" placeholder="your@email.com" class="w-full p-4 rounded-xl">
                    </div>
                </div>
                <button onclick="doRegister()" class="w-full py-4 rounded-xl font-bold text-white tracking-wide bg-gradient-to-r from-green-600 to-emerald-600 shadow-lg shadow-green-900/50 hover:scale-[1.02] transition">CREATE ACCOUNT</button>
            </div>

            <div id="msg" class="mt-4 text-center text-sm hidden font-bold p-3 rounded-lg"></div>
        </div>
    </div>

    <script>
        function switchTab(tab) {
            document.getElementById('form-login').classList.toggle('hidden', tab !== 'login');
            document.getElementById('form-register').classList.toggle('hidden', tab !== 'register');
            document.getElementById('tab-login').className = tab === 'login' ? 'flex-1 py-3 rounded-lg font-bold text-sm bg-purple-600 text-white shadow-lg' : 'flex-1 py-3 rounded-lg font-bold text-sm text-gray-400 hover:text-white transition';
            document.getElementById('tab-register').className = tab === 'register' ? 'flex-1 py-3 rounded-lg font-bold text-sm bg-purple-600 text-white shadow-lg' : 'flex-1 py-3 rounded-lg font-bold text-sm text-gray-400 hover:text-white transition';
        }

        function showMsg(text, isError = false) {
            const msg = document.getElementById('msg');
            msg.textContent = text;
            msg.className = `mt-4 text-center text-sm font-bold p-3 rounded-lg ${isError ? 'text-red-400 bg-red-500/10' : 'text-green-400 bg-green-500/10'}`;
            msg.classList.remove('hidden');
            setTimeout(() => msg.classList.add('hidden'), 5000);
        }

        async function doLogin() {
            const username = document.getElementById('login-username').value;
            const password = document.getElementById('login-password').value;
            if (!username || !password) return showMsg('Please fill all fields!', true);
            try {
                const res = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password})
                });
                const data = await res.json();
                if (data.status === 'success') window.location.href = '/';
                else showMsg(data.message, true);
            } catch (e) { showMsg('Connection error', true); }
        }

        async function doRegister() {
            const username = document.getElementById('reg-username').value;
            const password = document.getElementById('reg-password').value;
            const email = document.getElementById('reg-email').value;

            if (!username || !password) return showMsg('Username & password required!', true);
            try {
                const res = await fetch('/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password, email})
                });
                const data = await res.json();
                if (data.status === 'success') {
                    showMsg(data.message + ' ID: ' + data.user_id);
                    setTimeout(() => switchTab('login'), 2000);
                } else showMsg(data.message, true);
            } catch (e) { showMsg('Connection error', true); }
        }
    </script>
</body>
</html>
